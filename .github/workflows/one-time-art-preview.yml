name: One-time art direction preview
on:
  push:
    branches: [fix/final-champagne-forest-system-20261024]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /rieltor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          mkdir -p /tmp/editorial-review/rieltor
          cp -a out/. /tmp/editorial-review/rieltor/
          python3 -m http.server 4173 --directory /tmp/editorial-review &
          sleep 2
          node scripts/one-time-review.mjs
