name: Verify cinematic branch

on:
  push:
    branches: [feat/cinematic-editorial-20261023]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /rieltor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: |
          mkdir -p /tmp/cinematic-preview/rieltor
          cp -a out/. /tmp/cinematic-preview/rieltor/
          python3 -m http.server 4173 --directory /tmp/cinematic-preview &
          sleep 2
          node scripts/cinematic-smoke.mjs
