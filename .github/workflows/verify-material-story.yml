name: Verify material and story

on:
  push:
    branches: [fix/fast-story-and-material-balance-20261023]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /rieltor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: google-chrome --version
      - run: |
          mkdir -p /tmp/rieltor/rieltor
          cp -a out/. /tmp/rieltor/rieltor/
          python3 -m http.server 4173 --directory /tmp/rieltor &
          sleep 2
          node scripts/verify-material-story.mjs
