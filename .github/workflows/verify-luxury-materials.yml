name: Verify luxury material system
on:
  push:
    branches: [fix/luxury-color-system-plan-transition-icons-20261024]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /rieltor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: google-chrome --version
      - run: |
          mkdir -p /tmp/review/rieltor
          cp -a out/. /tmp/review/rieltor/
          python3 -m http.server 4173 --directory /tmp/review &
          sleep 2
          node scripts/verify-luxury-materials.mjs
